<!doctype html>
<!--
  Icon check sheet, 1280×500. Copy to meta/icon/check.html, then:
    node <skill>/scripts/render-html.mjs \
      --url "meta/icon/check.html?icon=../../icons/icon128.png&c=<competitor icon URL>&c=<another>" \
      --out meta/icon/check.png --width 1280 --height 500 --wait 1500
  icon is relative to this file; c= repeats for competitor icons from keyword-probe.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 600 18px/1.3 system-ui, sans-serif; color: #202124; background: #fff; padding: 36px 44px; }
  h2 { font-size: 20px; margin: 0 0 14px; color: #5f6368; font-weight: 600; }
  .row { display: flex; gap: 18px; margin-bottom: 30px; }
  .bg { display: flex; align-items: flex-end; gap: 22px; padding: 22px 26px; border-radius: 14px; }
  .bg span { display: block; font-size: 12px; color: inherit; opacity: .6; text-align: center; margin-top: 6px; }
  .light { background: #fff; outline: 1px solid #e0e0e0; }
  .grey { background: #f1f3f4; }
  .dark { background: #202124; color: #e8eaed; }
  .serp { display: flex; gap: 26px; padding: 22px 26px; background: #f1f3f4; border-radius: 14px; }
  .serp img { width: 64px; height: 64px; }
  .serp .ours { outline: 3px solid #1a73e8; outline-offset: 6px; border-radius: 12px; }
</style>
</head>
<body>
  <h2>Sizes on light, store grey and dark toolbar</h2>
  <div class="row" id="sizes"></div>
  <h2>Next to competitors in search results (ours outlined)</h2>
  <div class="serp" id="serp"></div>
<script>
  const params = new URLSearchParams(location.search);
  const icon = params.get('icon') ?? '';
  const img = (src, size) => Object.assign(document.createElement('img'), { src, width: size, height: size });
  for (const cls of ['light', 'grey', 'dark']) {
    const box = Object.assign(document.createElement('div'), { className: `bg ${cls}` });
    for (const size of [16, 32, 48, 128]) {
      const cell = document.createElement('div');
      const label = Object.assign(document.createElement('span'), { textContent: `${size}px` });
      cell.append(img(icon, size), label);
      box.append(cell);
    }
    document.getElementById('sizes').append(box);
  }
  const serp = document.getElementById('serp');
  const competitors = params.getAll('c');
  const ours = img(icon, 64);
  ours.className = 'ours';
  competitors.splice(Math.min(2, competitors.length), 0, null);
  for (const src of competitors) serp.append(src ? img(src, 64) : ours);
</script>
</body>
</html>
