<!doctype html>
<!-- Copy to meta/icon/check.html; render at 1280x500.
     ?icon=../assets/extension-icon.png&c=../competitors/ID/icon.png
     Repeat c= for locally saved competitor icons. Do not alter the real icons. -->
<html lang="en" data-soft-flat data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/soft-flat.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { padding: 24px; font: 600 14px/1.4 var(--app-font-body); color: var(--app-foreground); background-color: var(--app-background); }
  h1, h2 { font: 600 24px/1.2 var(--app-font-heading); margin-bottom: 12px; }
  h2 { margin-top: 16px; }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .panel { padding: 16px; border-radius: var(--app-radius-card); background-color: var(--app-surface-1); color: var(--app-foreground); }
  .panel.grey { background-color: var(--app-surface-2); }
  .sizes { display: flex; align-items: end; justify-content: space-between; gap: 8px; min-height: 0; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .cell img { display: block; object-fit: contain; }
  .cell span, .context { color: var(--app-muted); font-size: 12px; }
  .context { display: block; margin-bottom: 12px; }
  .serp { display: flex; align-items: start; gap: 24px; flex-wrap: wrap; padding: 16px; border-radius: var(--app-radius-card); background-color: var(--app-surface-1); }
  .serp .cell { min-width: 72px; }
  .serp img { width: 64px; height: 64px; object-fit: contain; }
  .ours span { color: var(--app-foreground); font-weight: 800; }
</style>
</head>
<body>
  <h1>One icon, every size</h1>
  <div class="row" id="sizes"></div>
  <h2>Alongside competitors</h2>
  <div class="serp" id="serp"></div>
<script>
  const params = new URLSearchParams(location.search);
  const icon = params.get('icon');
  if (!icon) window.__renderError = 'Icon check requires ?icon= with the real extension icon.';
  const img = (src, size, alt) => Object.assign(document.createElement('img'), { src: src || '', width: size, height: size, alt });
  for (const [cls, label] of [['light', 'Light'], ['grey', 'Store surface'], ['dark', 'Dark toolbar']]) {
    const box = Object.assign(document.createElement('section'), { className: `panel ${cls}` });
    box.append(Object.assign(document.createElement('span'), { className: 'context', textContent: label }));
    const sizes = Object.assign(document.createElement('div'), { className: 'sizes' });
    for (const size of [16, 32, 48, 128]) {
      const cell = Object.assign(document.createElement('div'), { className: 'cell' });
      cell.append(img(icon, size, `Extension icon at ${size} pixels`), Object.assign(document.createElement('span'), { textContent: `${size}px` }));
      sizes.append(cell);
    }
    box.append(sizes);
    document.getElementById('sizes').append(box);
  }
  const competitors = params.getAll('c');
  competitors.splice(Math.min(2, competitors.length), 0, null);
  for (const [index, src] of competitors.entries()) {
    const ours = src === null;
    const cell = Object.assign(document.createElement('div'), { className: `cell${ours ? ' ours' : ''}` });
    cell.append(img(ours ? icon : src, 64, ours ? 'Your extension icon' : `Competitor icon ${index + 1}`), Object.assign(document.createElement('span'), { textContent: ours ? 'Your icon' : 'Competitor' }));
    document.getElementById('serp').append(cell);
  }
  window.__renderReady = document.fonts.ready.then(() => {
    if (document.body.scrollHeight > innerHeight + 1 || document.body.scrollWidth > innerWidth + 1) {
      window.__renderError = 'Icon comparison overflows the canvas. Use at most ten competitor icons at 1280x500.';
    }
  });
</script>
</body>
</html>
