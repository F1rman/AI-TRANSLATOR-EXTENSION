<!doctype html>
<!-- Copy to meta/promo/tile.html; shared resources live in meta/assets/.
     Default: text-free symbol. Optional editorial variant: ?layout=split.
     Optional real icon: ?icon=../icon/brand-mark-1024.png. Edit the default SVG
     to represent the product; do not imply features it does not have.
     Render the same source at 440x280 and 1400x560 with render-html.mjs. -->
<html lang="en" data-soft-flat data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/soft-flat.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center; gap: 6vh;
    padding: 8vh; color: var(--app-foreground);
    background-color: var(--app-background);
    font: 600 14px/1.4 var(--app-font-body);
  }
  .words { display: none; min-width: 0; flex: 1 1 0; }
  h1 { font: 600 15vh/1.05 var(--app-font-heading); letter-spacing: -.035em; overflow-wrap: normal; }
  h1 em { font-style: normal; color: var(--app-muted); }
  .card {
    flex: 0 0 auto; width: min(76vh, 76vw); height: min(76vh, 76vw);
    display: grid; place-items: center; border-radius: var(--app-radius-card);
    background-color: var(--app-surface-1);
  }
  .card svg, .card img { display: block; width: 76%; height: 76%; object-fit: contain; }
  .card svg { color: var(--app-primary); }
  .split .words { display: block; }
  .split .card { width: min(60vh, 34vw); height: min(60vh, 34vw); }
  .mark { flex-direction: column; gap: 4vh; }
  .mark .words { display: block; flex: 0 0 auto; width: 100%; }
  .mark .card { width: 46vh; height: 46vh; }
  .mark h1 { font-size: 12vh; text-align: center; }
  .mark h1 br { display: none; }
</style>
</head>
<body class="split">
  <div class="words">
    <!-- EDIT for the optional text variant: 2-5 truthful words. -->
    <h1>Translate <br><em>with AI</em></h1>
  </div>
  <div class="card" aria-label="Product symbol">
    <!-- EDIT: one flat symbol or supply the real extension icon via ?icon=. -->
    <img src="../icon/brand-mark-1024.png" alt="AI Translator icon">
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const layout = params.get('layout');
  if (['symbol', 'split', 'mark'].includes(layout)) document.body.className = layout;
  const theme = params.get('theme');
  if (['light', 'dark'].includes(theme)) document.documentElement.dataset.theme = theme;
  if (params.has('icon')) {
    const image = Object.assign(document.createElement('img'), { src: params.get('icon'), alt: 'Extension icon' });
    document.querySelector('.card').replaceChildren(image);
  }
  window.__renderReady = document.fonts.ready.then(() => {
    if (!document.body.classList.contains('symbol')) {
      const heading = document.querySelector('h1');
      if (heading.scrollWidth > heading.clientWidth + 1 || document.body.scrollHeight > innerHeight + 1) {
        window.__renderError = 'Promo headline overflows. Shorten the words; do not shrink the headline.';
      }
    }
  });
</script>
</body>
</html>
